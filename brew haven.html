<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Brew Haven | Brand Presentation</title>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
</head>

<body>
        <nav class="navbar">
                <div class="logo-small">BREW HAVEN</div>
                <ul class="nav-links">
                        <li><a href="#hero">Home</a></li>
                        <li><a href="#identity">Identity</a></li>
                        <li><a href="#logos">Logos</a></li>
                        <li><a href="#mockups">Mockups</a></li>
                        <li><a href="#gallery">Gallery</a></li>
                </ul>
        </nav>

        <header id="hero" class="hero">
                <div class="hero-bg">
                        <img src="Artboard 22@2x-100.jpg" alt="Brew Haven Background">
                </div>
                <div class="hero-gradient"></div>
                <div class="hero-content">
                        <h1 class="logo-text"><img class="logo-main" src="Artboard 2.png" alt="1"></h1>
                        <p class="subtitle">Brand Strategy & Identity Presentation</p>
                </div>
                <div class="scroll-indicator">↓</div>
        </header>

        <section id="identity" class="presentation-section">
                <div class="container">
                        <h2 class="section-title">Brand Identity</h2>
                        <div class="grid-2col">
                                <div class="scroll-reveal img-container">
                                        <img src="Artboard 1@2x-100.jpg" alt="Brand Story">
                                </div>
                                <div class="scroll-reveal img-container">
                                        <img src="Artboard 7@2x-100.jpg" alt="Color Palette">
                                </div>
                                <div class="scroll-reveal full-width img-container">
                                        <img src="Artboard 5@2x-100.jpg" alt="Typography">
                                </div>
                        </div>
                </div>
        </section>

        <section id="logos" class="presentation-section dark-bg">
                <div class="container">
                        <h2 class="section-title text-light">Logo Showcase</h2>
                        <div class="grid-2col">
                                <div class="scroll-reveal img-container">
                                        <img src="Artboard 16@2x-100.jpg" alt="Logo Construction">
                                </div>
                                <div class="scroll-reveal img-container">
                                        <img src="Artboard 2@2x-100.jpg" alt="Logo Variations">
                                </div>
                        </div>
                </div>
        </section>

        <section id="mockups" class="presentation-section">
                <div class="container">

                        <h2 class="section-title">Merchandise & Applications</h2>
                        <div class="grid-masonry">
                                <div class="scroll-reveal img-container"><img
                                                src="Artboard 18@2x-100.jpg" alt="Coffee Bags"></div>
                                <div class="scroll-reveal img-container"><img
                                                src="Artboard 15@2x-100.jpg" alt="Business Cards">

                                                src="Artboard 19@2x-100.jpg" alt="Coffee Cups"></div>

                                <div class="scroll-reveal img-container"><img

                                <div class="scroll-reveal img-container"><img
                                                src="Artboard 41@2x-100.jpg" alt="Variation 1"></div>


                                <div class="scroll-reveal img-container"><img
                                                src="Artboard 44@2x-100.jpg" alt="Variation 3">

                                <div class="scroll-reveal img-container"><img
                                                src="Artboard 1 copy 2@2x-100.jpg" alt="Variation 4">
                                </div>

                        </div>
                </div>
        </section>

                                <div class="scroll-reveal img-container"><img

                                <div class="scroll-reveal img-container"><img
